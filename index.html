<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Winter ARC - 90 Day Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND -->
    <div class="background-layer"></div>


    <!-- MAIN WEBSITE -->
    <main class="challenge-container">


        <!-- TOP WINTER ARC -->
        <header class="hero-section">

            <img
                src="winter-arc.png"
                alt="Winter ARC"
                class="winter-logo"
            >

        </header>



        <!-- 90 DAYS -->
        <section class="days-section">

            <div
                id="daysGrid"
                class="days-grid">
            </div>

        </section>



        <!-- GRAPHIC DESIGNERS -->
        <footer class="challenge-footer">

            <h2 class="community-name">
        
            </h2>


            <div class="logo-container">

                <img
                    src="graphic-designers.png"
                    alt="Graphic Designers Logo"
                    class="community-logo"
                >

            </div>

        </footer>


    </main>


    <script src="script.js"></script>

</body>

</html>
